<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concoction Creator V4</title><style>body{font-family:Segoe UI,sans-serif;background:#eef2f7;margin:0;padding:20px} .grid{display:grid;grid-template-columns:420px 1fr;gap:20px}.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)} input,textarea,select{width:100%;padding:8px;margin:4px 0 8px;box-sizing:border-box}.ing{padding:6px;border-top:1px solid #ddd} button{margin:2px;padding:6px 10px}.legend span{display:inline-block;width:12px;height:12px;margin-right:6px}.bar{height:16px;background:#ddd;border-radius:8px;overflow:hidden}.fill{height:100%;background:#0078d4}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><h1>🧪 Concoction Creator V4</h1><div class="grid"><div class="card"><input id="question" placeholder="Question"><textarea id="instructions" placeholder="Instructions"></textarea><button onclick="lockActivity()">Lock Activity</button><textarea id="notes" placeholder="Group notes"></textarea><input id="ingredientName" placeholder="Ingredient name"><select id="ingredientColour"><option value="#8ecae6">Light Blue</option><option value="#1d4ed8">Dark Blue</option><option value="#90ee90">Light Green</option><option value="#166534">Dark Green</option><option value="#facc15">Yellow</option><option value="#f97316">Orange</option><option value="#ef4444">Red</option><option value="#ec4899">Pink</option><option value="#9333ea">Purple</option><option value="#14b8a6">Teal</option></select><button onclick="addIngredient()">Add Ingredient</button><hr><input id="potionName" placeholder="Concoction name" oninput="render()"><select id="shape" onchange="render()"><option>Apothecary</option><option>Heart Bottle</option><option>Potion Flask</option></select><select id="stopper" onchange="render()"><option>Lion</option><option>Compass</option><option>Shield</option><option>Diamond</option><option>Lightning</option></select><div id="capacity"></div><div class="bar"><div id="capfill" class="fill"></div></div><div id="ingredientList"></div><button onclick="exportJSON()">Export JSON</button></div><div class="card"><svg id="bottleSvg" viewBox="0 0 500 500" width="100%"></svg><div id="legend" class="legend"></div></div></div><script>const MAX=30;let ingredients=[];function lockActivity(){question.disabled=true;instructions.disabled=true}function total(){return ingredients.reduce((a,b)=>a+b.qty,0)}function addIngredient(){const n=document.getElementById('ingredientName').value.trim();if(!n)return;if(total()>=MAX)return;ingredients.push({name:n,colour:ingredientColour.value,qty:1});ingredientName.value='';drawIngredients();render()}function changeQty(i,d){if(d>0&&total()>=MAX)return;ingredients[i].qty=Math.max(1,ingredients[i].qty+d);drawIngredients();render()}function removeIngredient(i){ingredients.splice(i,1);drawIngredients();render()}function drawIngredients(){const el=document.getElementById('ingredientList');el.innerHTML='';ingredients.forEach((x,i)=>{el.innerHTML+=`<div class=ing>${x.name} <button onclick="changeQty(${i},-1)">-</button>${x.qty}<button onclick="changeQty(${i},1)">+</button><button onclick="removeIngredient(${i})">Delete</button></div>`});capacity.innerText=`${total()}/30 parts`;capfill.style.width=(total()/30*100)+'%'}function render(){const svg=document.getElementById('bottleSvg');const icons={Lion:'🦁',Compass:'🧭',Shield:'🛡️',Diamond:'💎',Lightning:'⚡'};let y=400,layers='';ingredients.forEach(i=>{let h=(i.qty/30)*260;y-=h;layers+=`<rect x='175' y='${y}' width='150' height='${h}' fill='${i.colour}'/>`});let path="M175 100 L175 400 Q175 450 250 450 Q325 450 325 400 L325 100 Z";if(shape.value==='Heart Bottle'){path='M250 170 C250 110 170 60 120 120 C70 180 100 280 250 420 C400 280 430 180 380 120 C330 60 250 110 250 170 Z'}svg.innerHTML=`<text x='250' y='40' text-anchor='middle' font-size='30'>${icons[stopper.value]}</text><path d="${path}" fill='rgba(255,255,255,.15)' stroke='#555' stroke-width='5'/><g>${layers}</g><text x='250' y='485' text-anchor='middle'>${potionName.value||'Unnamed Concoction'}</text>`;legend.innerHTML=ingredients.map(i=>`<div><span style="background:${i.colour}"></span>${i.name} (${i.qty})</div>`).join('')}function exportJSON(){const data={question:question.value,instructions:instructions.value,notes:notes.value,name:potionName.value,ingredients};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='concoction.json';a.click()}render();drawIngredients();</script></body></html>
