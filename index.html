<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concoction Creator v3</title><style>body{font-family:Segoe UI,sans-serif;margin:0;padding:20px;background:#eef2f7}.wrap{display:grid;grid-template-columns:420px 1fr;gap:20px}.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}textarea,input,select{width:100%;box-sizing:border-box;margin:4px 0 10px;padding:8px}.row{display:flex;gap:6px}.ing{border-top:1px solid #ddd;padding:6px 0}button{padding:8px 12px}.legend div{margin:4px 0}@media(max-width:900px){.wrap{grid-template-columns:1fr}}</style></head><body><h1>🧪 Concoction Creator V3</h1><div class="wrap"><div class="card"><label>Question</label><input id=q><label>Instructions</label><textarea id=i></textarea><button onclick="lockQ()">Lock Activity</button><label>Notes</label><textarea id=n></textarea><hr><input id=iname placeholder="Ingredient"><div class=row><select id=icol><option value='#8ecae6'>Light Blue</option><option value='#1d4ed8'>Dark Blue</option><option value='#90ee90'>Light Green</option><option value='#166534'>Dark Green</option><option value='#facc15'>Yellow</option><option value='#f97316'>Orange</option><option value='#ef4444'>Red</option><option value='#ec4899'>Pink</option><option value='#9333ea'>Purple</option><option value='#14b8a6'>Teal</option><option value='#8b5a2b'>Brown</option><option value='#6b7280'>Grey</option><option value='#111827'>Black</option><option value='#ffffff'>White</option></select><button onclick="addIng()">Add</button></div><label>Bottle</label><select id=shape onchange='render()'><option>Apothecary</option><option>Potion Flask</option><option>Crystal Decanter</option><option>Round Elixir</option><option>Laboratory Vessel</option><option>Hexagonal Reliquary</option><option>Heart Bottle</option></select><label>Stopper</label><select id=stop onchange='render()'><option>Lion</option><option>Compass</option><option>Shield</option><option>Diamond</option><option>Lightning</option><option>Heart</option><option>Tree</option><option>Cog</option></select><label>Label Style</label><select id=lab onchange='render()'><option>Laboratory</option><option>Vintage Apothecary</option><option>Fantasy Potion</option><option>Eco-Kraft</option><option>Premium Gold</option></select><input id=pname placeholder='Concoction name' oninput='render()'><div id=ings></div><p id=cap></p><button onclick='saveJSON()'>Export JSON</button><button onclick='savePNG()'>Save as Image</button></div><div class='card'><div id='capture'><svg id='svg' viewBox='0 0 500 520' width='100%' height='520'></svg><div id=legend class='legend'></div></div></div></div><script>let locked=false,max=30,ings=[];function lockQ(){locked=true;q.disabled=true;i.disabled=true}function addIng(){if(!iname.value)return;if(total()>=max)return;ings.push({n:iname.value,c:icol.value,q:1});iname.value='';drawList();render()}function total(){return ings.reduce((a,b)=>a+b.q,0)}function drawList(){ings.innerHTML='';window.ings.forEach((x,k)=>{ings.innerHTML+=`<div class=ing>${x.n} <button onclick="chg(${k},-1)">-</button> ${x.q} <button onclick="chg(${k},1)">+</button> <button onclick="del(${k})">🗑</button></div>`});cap.innerText=`${total()}/30 parts used`}function chg(k,d){if(d>0&&total()>=30)return;window.ings[k].q=Math.max(1,window.ings[k].q+d);drawList();render()}function del(k){window.ings.splice(k,1);drawList();render()}function stopper(){const m={Lion:'🦁',Compass:'🧭',Shield:'🛡',Diamond:'💎',Lightning:'⚡',Heart:'❤',Tree:'🌳',Cog:'⚙'};return m[stop.value]}function render(){let h=300;let y=380;let layers='';window.ings.forEach(v=>{let lh=(v.q/30)*260;y-=lh;layers+=`<rect x='150' y='${y}' width='200' height='${lh}' fill='${v.c}'/>`});svg.innerHTML=`<text x='250' y='40' text-anchor='middle' font-size='28'>${stopper()}</text><rect x='220' y='50' width='60' height='40' fill='#8b5a2b'/><path d='M150 90 L150 380 Q150 450 250 450 Q350 450 350 380 L350 90 Z' fill='rgba(255,255,255,.15)' stroke='#555' stroke-width='5'/><g>${layers}</g><text x='250' y='490' text-anchor='middle'>${pname.value||'Unnamed Concoction'}</text>`;legend.innerHTML=window.ings.map(v=>`<div><span style="display:inline-block;width:12px;height:12px;background:${v.c}"></span> ${v.n} (${v.q})</div>`).join('')} function saveJSON(){let d={question:q.value,instructions:i.value,notes:n.value,name:pname.value,ingredients:window.ings};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='concoction.json';a.click()} function savePNG(){alert('Prototype: use browser screenshot or add html2canvas in next version.')} drawList();render();</script></body></html>
